# Integración continua: en cada push a main y en cada pull request corren las
# pruebas de la API y de la app, se construyen las imágenes Docker y se recorre
# la plataforma de punta a punta. Lo que llega a main y pasa todo eso se publica
# como imágenes con la etiqueta del commit.
#
# Las acciones van fijadas al commit de su versión, no a la etiqueta: una
# etiqueta se puede mover a otro código; un commit, no. Dependabot propone las
# actualizaciones (.github/dependabot.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · formato y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: expoideas-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # spotless:check corre en la fase verify (ver pom.xml): sin formato aparte.
      - name: Compilar, formato y probar
        run: ./mvnw -B verify
      # No rompe el build: es para ver de dónde se parte y hacia dónde va.
      - name: Cobertura de las pruebas
        if: always()
        run: |
          informe=target/site/jacoco/jacoco.csv
          [ -f "$informe" ] || exit 0
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END { printf "### Cobertura de la API\n\n| Líneas | Ramas |\n|---|---|\n| %.1f %% | %.1f %% |\n", 100 * lc / (lm + lc), 100 * bc / (bm + bc) }' \
            "$informe" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-api
          path: expoideas-api/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  app:
    name: App · lint, formato, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: expoideas-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: expoideas-app/package-lock.json
      - run: npm ci
      # Lo que llega al navegador de la gente: falla con una vulnerabilidad alta o crítica.
      # Las de las herramientas de desarrollo las avisa Dependabot.
      - name: Dependencias con vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - name: Pruebas, con cobertura
        run: npm run test:coverage
      - name: Cobertura de las pruebas
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            console.log("### Cobertura de la app\n\n| Líneas | Ramas | Funciones |\n|---|---|---|");
            console.log("| " + total.lines.pct + " % | " + total.branches.pct + " % | " + total.functions.pct + " % |");
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Solo valida sintaxis y que las variables resuelvan: no levanta nada,
      # así que estos valores de relleno no representan ningún secreto real.
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
        env:
          DB_PASSWORD: placeholder
          MYSQL_ROOT_PASSWORD: placeholder
          JWT_SECRET: placeholder
      - name: Validar docker-compose.prod.yml (imágenes publicadas, sin compilar)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > resuelto.yml
          grep -q 'expoideas-api:abc1234' resuelto.yml
          grep -q 'expoideas-app:abc1234' resuelto.yml
          ! grep -q 'build:' resuelto.yml
        env:
          DB_PASSWORD: placeholder
          MYSQL_ROOT_PASSWORD: placeholder
          JWT_SECRET: placeholder
          IDEARIUM_VERSION: abc1234

  # La plataforma entera levantada como en producción (MySQL, API y Nginx con la app)
  # y recorrida de punta a punta: lo que las pruebas de cada proyecto no ven.
  e2e:
    name: De punta a punta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Secretos al azar que solo viven lo que dura esta corrida. El primer administrador
      # sale del arranque, como en una instalación de verdad: el sembrado entra con esa
      # contraseña temporal y hace su primer ingreso.
      - name: Crear el .env
        run: |
          admin_password="Qa-$(openssl rand -hex 9)#7"
          echo "::add-mask::$admin_password"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "ADMIN_EMAIL=qa.admin@unisimon.edu.co"
            echo "ADMIN_PASSWORD=$admin_password"
          } > .env
      # --wait espera a que los tres servicios pasen su comprobación de salud.
      - name: Levantar la plataforma
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa/e2e/package-lock.json
      - name: Cuentas de prueba
        run: node qa/seed.mjs
      - name: Recorrido de la API por rol
        run: node qa/smoke.mjs
      - name: Instalar Playwright
        working-directory: qa/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Recorrido en el navegador
        working-directory: qa/e2e
        run: npx playwright test
      - name: Logs de la plataforma
        if: failure()
        run: docker compose logs --no-color --tail 300
      # Capturas y trazas de lo que falló. Las cuentas son de esta corrida y ya no existen.
      - name: Guardar el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-playwright
          path: |
            qa/e2e/playwright-report/
            qa/e2e/test-results/
          retention-days: 7

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # pull: siempre sobre la imagen base de hoy, que es la que trae los parches del sistema.
      - name: Construir la imagen de la API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./expoideas-api
          push: false
          load: true
          pull: true
          tags: expoideas-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Construir la imagen de la app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./expoideas-app
          push: false
          load: true
          pull: true
          tags: expoideas-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      # Las dependencias de Java viajan dentro del .jar de la imagen de la API: el escaneo
      # de la imagen las cubre junto con los paquetes del sistema.
      # Todo lo alto y crítico que ya tiene arreglo, al resumen de la corrida.
      - name: Vulnerabilidades de la imagen de la API (informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expoideas-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-expoideas-api.txt
      # Lo crítico con arreglo publicado no se publica: se actualiza la dependencia o la imagen base.
      - name: Vulnerabilidades críticas de la imagen de la API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expoideas-api:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      # Todo lo alto y crítico que ya tiene arreglo, al resumen de la corrida.
      - name: Vulnerabilidades de la imagen de la app (informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expoideas-app:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-expoideas-app.txt
      # Lo crítico con arreglo publicado no se publica: se actualiza la dependencia o la imagen base.
      - name: Vulnerabilidades críticas de la imagen de la app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expoideas-app:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Resumen de vulnerabilidades
        if: always()
        run: |
          {
            echo "### Vulnerabilidades altas y críticas con arreglo publicado"
            for informe in trivy-expoideas-api.txt trivy-expoideas-app.txt; do
              [ -f "$informe" ] || continue
              echo
              echo "**${informe#trivy-}**"
              echo
              if [ -s "$informe" ]; then echo '```'; cat "$informe"; echo '```'; else echo "Ninguna."; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Solo lo que llega a main y pasó todo lo anterior. Cada imagen sale con la
  # etiqueta del commit, que es la que se pone en IDEARIUM_VERSION para
  # desplegarla o para volver a ella (docs/despliegue.md).
  publicar:
    name: Publicar imágenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, app, compose, e2e, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # El registro pide el nombre en minúsculas; la etiqueta son los siete primeros caracteres del commit.
      - name: Nombre y etiqueta
        id: imagen
        run: |
          echo "registro=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Publicar la imagen de la API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./expoideas-api
          push: true
          pull: true
          build-args: APP_VERSION=${{ steps.imagen.outputs.version }}
          tags: |
            ${{ steps.imagen.outputs.registro }}/expoideas-api:${{ steps.imagen.outputs.version }}
            ${{ steps.imagen.outputs.registro }}/expoideas-api:latest
          cache-from: type=gha,scope=api
      - name: Publicar la imagen de la app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./expoideas-app
          push: true
          pull: true
          build-args: APP_VERSION=${{ steps.imagen.outputs.version }}
          tags: |
            ${{ steps.imagen.outputs.registro }}/expoideas-app:${{ steps.imagen.outputs.version }}
            ${{ steps.imagen.outputs.registro }}/expoideas-app:latest
          cache-from: type=gha,scope=app
      - name: Qué se publicó
        run: |
          {
            echo "### Versión publicada: \`${{ steps.imagen.outputs.version }}\`"
            echo
            echo "Para desplegarla: \`IDEARIUM_VERSION=${{ steps.imagen.outputs.version }}\` en el \`.env\` del servidor y"
            echo "\`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
