# ==========================================
# Expoideas - Perfil de producción
# ==========================================
# Se activa con SPRING_PROFILES_ACTIVE=prod (la imagen Docker ya lo trae).
# Solo cambia lo que difiere de application.properties; las credenciales siguen
# llegando por variables de entorno.

# --- Documentación de la API ---
# Swagger expone todos los endpoints y modelos: no se publica en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Detrás de un proxy inverso ---
# Nginx (o el proxy de TI) termina HTTPS y reenvía con X-Forwarded-*. Con esto la
# API sabe el esquema y host reales: HSTS en HTTPS y CORS de mismo origen.
# La API no debe quedar expuesta directamente a Internet: confía en esas cabeceras.
server.forward-headers-strategy=framework

# --- Respuestas ---
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
