# Expoideas: app en /expoideas/ y API en /expoideas/api/ (mismo origen).
# Nginx sin privilegios escucha en 8080. Si TI pone otro proxy delante (HTTPS),
# se respetan sus X-Forwarded-Proto y X-Forwarded-Host.

map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $host_original {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# Freno a los intentos en serie contra el inicio de sesión y el registro: por
# dirección, cinco peticiones por segundo sostenidas y ráfagas de hasta 60. Es holgado
# a propósito, porque un salón entero entra desde la misma dirección de la universidad
# (y con Docker Desktop, todos los clientes llegan con la dirección de la red de Docker):
# cada persona gasta dos al registrarse y entrar.
#
# La dirección es la última de X-Forwarded-For, que es la que vio el proxy de TI; sin
# proxy delante esa cabecera la escribe quien quiera y el límite se puede esquivar.
# Las demás rutas quedan con la clave vacía, que Nginx no cuenta.
#
# La ruta se compara con y sin /expoideas: el límite se evalúa después del rewrite
# de la location de la API, cuando $uri ya es /api/v1/auth/... Comparando solo la
# ruta original la clave quedaba siempre vacía y el freno no frenaba nada.
map $http_x_forwarded_for $direccion_cliente {
    ~([^,\s]+)\s*$ $1;
    default        $remote_addr;
}

map $uri $clave_limite_acceso {
    ~^(/expoideas)?/api/v1/auth/ $direccion_cliente;
    default                   '';
}

limit_req_zone $clave_limite_acceso zone=acceso:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Redirecciones relativas: con un puerto o proxy delante, una absoluta apuntaría
    # al puerto interno del contenedor.
    absolute_redirect off;

    # Holgado a propósito: el límite real (5 MB por archivo) lo aplica la API y
    # responde con un mensaje claro. Si Nginx cortara antes, devolvería una página HTML.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Con el proxy de TI delante, las peticiones llegan con la cabecera Via, y por
    # defecto Nginx no comprime nada de lo que llega así: la app saldría sin comprimir.
    gzip_proxied any;
    gzip_vary on;

    # El nombre «api» se vuelve a resolver cada pocos segundos con el DNS interno de
    # Docker. Sin esto Nginx se queda con la dirección que la API tenía cuando él
    # arrancó: si la API se recrea con otra (una actualización), responde 502 hasta
    # que alguien lo reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeceras de seguridad para la app. Van a nivel de servidor: ninguna
    # location usa add_header, que las reemplazaría.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / {
        return 302 /expoideas/;
    }

    location = /expoideas {
        return 301 /expoideas/;
    }

    # Salud para el monitoreo de TI: 200 con {"status":"UP"} si la API, la base y el
    # disco de los archivos están bien; 503 con "DOWN" si no; 502 si la API no responde.
    # No dice nada más: el detalle es de quien administra (/api/v1/admin/status).
    location = /expoideas/salud {
        set $api http://api:8080;
        rewrite ^ /actuator/health break;
        proxy_pass $api;
        proxy_http_version 1.1;
        access_log off;
    }

    # API: /expoideas/api/v1/... -> http://api:8080/api/v1/...
    location /expoideas/api/ {
        limit_req zone=acceso burst=60 nodelay;
        limit_req_status 429;

        # Con el destino en una variable, Nginx lo resuelve en cada petición (ver
        # «resolver») y envía la ruta tal como queda tras el rewrite.
        set $api http://api:8080;
        rewrite ^/expoideas(/api/.*)$ $1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
        proxy_set_header X-Forwarded-Host $host_original;
        proxy_read_timeout 60s;
    }

    # Recursos con hash en el nombre: nunca cambian, caché de un año.
    location /expoideas/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
    }

    # index.html siempre se revalida para que un despliegue nuevo se vea de inmediato.
    location = /expoideas/index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    # Rutas de la app (React Router): lo que no es un archivo devuelve index.html.
    location /expoideas/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /expoideas/index.html;
    }
}
